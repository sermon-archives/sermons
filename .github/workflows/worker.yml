name: Refresh sermon archive
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: transcription-worker
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPEN_ROUTER: ${{ secrets.OPEN_ROUTER }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-en-v1
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install -r requirements.txt
      - name: Pull Turso queue state when configured
        if: ${{ env.TURSO_DATABASE_URL != '' }}
        run: python scripts/turso_sync.py --pull
      - name: Collect latest metadata (rate limited)
        run: python scripts/collect.py --limit 20
      - name: Transcribe at most one new sermon
        run: python scripts/worker.py --limit 1
      - name: Persist to Turso when configured
        if: ${{ env.TURSO_DATABASE_URL != '' }}
        run: python scripts/turso_sync.py
      - name: Generate LLM summaries when OpenRouter is configured
        if: ${{ env.OPEN_ROUTER != '' || env.OPENROUTER_API_KEY != '' || env.OPENAI_API_KEY != '' }}
        run: python scripts/summarize.py --limit 1
      - name: Generate biblical strengths and weaknesses reviews
        if: ${{ env.OPEN_ROUTER != '' || env.OPENROUTER_API_KEY != '' || env.OPENAI_API_KEY != '' }}
        run: python scripts/review.py --limit 1
      - name: Generate sermon outlines
        if: ${{ env.OPEN_ROUTER != '' || env.OPENROUTER_API_KEY != '' || env.OPENAI_API_KEY != '' }}
        run: python scripts/outline.py --limit 1
      - name: Generate devotional questions
        if: ${{ env.OPEN_ROUTER != '' || env.OPENROUTER_API_KEY != '' || env.OPENAI_API_KEY != '' }}
        run: python scripts/devotional.py --limit 1
      - name: Commit catalog and generated Markdown
        run: |
          git config user.name "sermon-archive[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sermons.json content/sermons
          git diff --cached --quiet || git commit -m "Refresh sermon catalog" && git push
